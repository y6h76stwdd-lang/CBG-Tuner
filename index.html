<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cigar Box Guitar Tuner</title>
<style>
  :root { --bg:#14110f; --card:#221d19; --line:#3a322b; --text:#f3ece4; --dim:#a89c8f; --accent:#e0a458; --ok:#5fd16f; --warn:#f2c94c; --bad:#f2784b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; }
  h1 { font-size:18px; margin:4px 0 14px; letter-spacing:.03em; color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:14px; }
  .row { display:flex; align-items:center; gap:10px; }
  .row + .row { margin-top:10px; }
  label.k { color:var(--dim); font-size:13px; min-width:64px; }
  .stepper { display:flex; align-items:center; gap:14px; margin-left:auto; }
  .stepper button { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:#2c2520; color:var(--text); font-size:22px; }
  .stepper span { font-size:22px; font-weight:600; min-width:24px; text-align:center; }
  select { flex:1; background:#2c2520; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:17px; }
  .readout { text-align:center; }
  #note { font-size:88px; font-weight:700; line-height:1; transition:color .15s; }
  #status { font-size:18px; margin-top:6px; min-height:24px; }
  #hz { font-size:13px; color:var(--dim); margin-top:4px; min-height:18px; font-variant-numeric:tabular-nums; }
  .meter { position:relative; height:70px; margin:14px 4px 4px; }
  .tick { position:absolute; top:50%; width:2px; background:#5a4f45; transform:translate(-50%,-50%); }
  .tick.mid { width:4px; background:var(--ok); }
  #needle { position:absolute; top:50%; left:50%; width:7px; height:62px; border-radius:4px; background:var(--dim);
            transform:translate(-50%,-50%); transition:left .08s linear, background .15s; opacity:.25; }
  .strings button.s { flex:1; min-width:0; padding:10px 0; border-radius:12px; border:1px solid var(--line); background:#2c2520; color:var(--text); }
  .strings button.s b { display:block; font-size:20px; }
  .strings button.s small { color:var(--dim); font-size:11px; }
  .strings button.s.sel { background:var(--accent); color:#1a1209; border-color:var(--accent); }
  .strings button.s.sel small { color:#4a3516; }
  .strings .tone { width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:#2c2520; color:var(--text); font-size:16px; flex:none; }
  .strings .tone.on { background:var(--accent); color:#1a1209; }
  .hint { color:var(--dim); font-size:12px; line-height:1.4; margin-top:10px; }
  #start { width:100%; padding:16px; font-size:18px; font-weight:600; border:0; border-radius:14px; background:var(--accent); color:#1a1209; }
  #err { color:var(--bad); font-size:14px; margin-top:10px; display:none; }
</style>
</head>
<body>
<h1>🎸 CIGAR BOX TUNER</h1>

<div class="card">
  <div class="row">
    <label class="k">Strings</label>
    <div class="stepper">
      <button id="minus" aria-label="Fewer strings">−</button>
      <span id="count">3</span>
      <button id="plus" aria-label="More strings">+</button>
    </div>
  </div>
  <div id="pickers"></div>
  <div class="hint">Pick the note each string should be tuned to (lowest string first).</div>
</div>

<div class="card readout">
  <div id="note">–</div>
  <div id="status">Tap Start, then pluck a string</div>
  <div id="hz"></div>
  <div class="meter" id="meter"><div id="needle"></div></div>
</div>

<div class="card strings">
  <div class="row" id="stringRow"></div>
  <div class="hint" id="lockHint">Auto: the tuner picks the closest string. Tap a string to lock onto it. Tap ♪ to hear its pitch.</div>
</div>

<button id="start">Start tuner</button>
<div id="err"></div>

<script>
// ---------- Music helpers ----------
const NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const midiName = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);
const freqMidi = f => 69 + 12 * Math.log2(f / 440);
const MIN_MIDI = 28, MAX_MIDI = 76; // E1 .. E5
const MAX_STRINGS = 12;

// ---------- Pitch detection (YIN) ----------
//YIN-START
function yin(x, sampleRate, minFreq = 45, maxFreq = 700, threshold = 0.12) {
  const n = x.length, half = n >> 1;
  let e = 0; for (let i = 0; i < n; i++) e += x[i] * x[i];
  if (Math.sqrt(e / n) < 0.006) return null;
  const minTau = Math.max(2, Math.floor(sampleRate / maxFreq));
  const maxTau = Math.min(half - 2, Math.floor(sampleRate / minFreq));
  if (maxTau <= minTau) return null;
  const d = new Float32Array(maxTau + 2);
  for (let tau = 1; tau <= maxTau + 1; tau++) {
    let s = 0;
    for (let i = 0; i < half; i++) { const diff = x[i] - x[i + tau]; s += diff * diff; }
    d[tau] = s;
  }
  const c = new Float32Array(maxTau + 2); c[0] = 1;
  let run = 0;
  for (let tau = 1; tau <= maxTau + 1; tau++) { run += d[tau]; c[tau] = run > 0 ? d[tau] * tau / run : 1; }
  for (let tau = minTau; tau <= maxTau; tau++) {
    if (c[tau] < threshold) {
      while (tau + 1 <= maxTau && c[tau + 1] < c[tau]) tau++;
      const a = c[tau - 1], b = c[tau], g = c[tau + 1], den = a - 2 * b + g;
      const shift = den !== 0 ? 0.5 * (a - g) / den : 0;
      return sampleRate / (tau + shift);
    }
  }
  return null;
}
//YIN-END

// ---------- State ----------
const $ = id => document.getElementById(id);
const DEFAULTS = {
  1:[43], 2:[43,50], 3:[43,50,55], 4:[43,50,55,59], 5:[40,45,50,55,59],
  6:[40,45,50,55,59,64], 7:[35,40,45,50,55,59,64], 8:[35,40,45,50,55,59,64,69]
};
let notes = DEFAULTS[3].slice();   // MIDI numbers, lowest first
let locked = null;                 // index of locked string or null

try {
  const saved = JSON.parse(localStorage.getItem("cbtuner") || "null");
  if (saved && Array.isArray(saved) && saved.length >= 1 && saved.length <= MAX_STRINGS &&
      saved.every(m => Number.isInteger(m) && m >= MIN_MIDI && m <= MAX_MIDI)) notes = saved;
} catch (e) {}
const save = () => { try { localStorage.setItem("cbtuner", JSON.stringify(notes)); } catch (e) {} };

function defaultsFor(n) {
  if (DEFAULTS[n]) return DEFAULTS[n].slice();
  const out = DEFAULTS[8].slice();
  while (out.length < n) out.push(Math.min(MAX_MIDI, out[out.length - 1] + 5));
  return out;
}

// ---------- UI: string count + note pickers ----------
function renderPickers() {
  $("count").textContent = notes.length;
  const box = $("pickers"); box.innerHTML = "";
  notes.forEach((m, i) => {
    const row = document.createElement("div"); row.className = "row";
    const lab = document.createElement("label"); lab.className = "k"; lab.textContent = "String " + (i + 1);
    const sel = document.createElement("select");
    for (let k = MIN_MIDI; k <= MAX_MIDI; k++) {
      const o = document.createElement("option"); o.value = k; o.textContent = midiName(k) + "  (" + midiFreq(k).toFixed(1) + " Hz)";
      if (k === m) o.selected = true; sel.appendChild(o);
    }
    sel.onchange = () => { notes[i] = +sel.value; save(); renderStrings(); };
    row.append(lab, sel); box.appendChild(row);
  });
  renderStrings();
}

let toneIdx = null, osc = null, oscCtx = null;
function stopTone() { if (osc) { try { osc.stop(); } catch (e) {} osc = null; } toneIdx = null; }
function playTone(i) {
  const wasOn = toneIdx === i; stopTone();
  if (wasOn) { renderStrings(); return; }
  try {
    oscCtx = oscCtx || new (window.AudioContext || window.webkitAudioContext)();
    oscCtx.resume();
    osc = oscCtx.createOscillator(); const g = oscCtx.createGain();
    osc.type = "triangle"; osc.frequency.value = midiFreq(notes[i]); g.gain.value = 0.25;
    osc.connect(g).connect(oscCtx.destination); osc.start(); toneIdx = i;
  } catch (e) {}
  renderStrings();
}

function renderStrings() {
  const row = $("stringRow"); row.innerHTML = "";
  notes.forEach((m, i) => {
    const b = document.createElement("button"); b.className = "s" + (locked === i ? " sel" : "");
    b.innerHTML = "<b>" + midiName(m) + "</b><small>" + (i + 1) + "</small>";
    b.onclick = () => { locked = locked === i ? null : i; renderStrings(); updateHint(); };
    row.appendChild(b);
  });
  // tone buttons on a second row for tidy layout
  let t = $("toneRow"); if (t) t.remove();
  t = document.createElement("div"); t.id = "toneRow"; t.className = "row";
  notes.forEach((m, i) => {
    const b = document.createElement("button"); b.className = "tone" + (toneIdx === i ? " on" : "");
    b.style.flex = "1"; b.style.width = "auto"; b.style.borderRadius = "10px"; b.style.height = "38px";
    b.textContent = toneIdx === i ? "■" : "♪"; b.setAttribute("aria-label", "Play " + midiName(m));
    b.onclick = () => playTone(i); t.appendChild(b);
  });
  row.after(t);
}
function updateHint() {
  $("lockHint").textContent = locked === null
    ? "Auto: the tuner picks the closest string. Tap a string to lock onto it. Tap ♪ to hear its pitch."
    : "Locked to string " + (locked + 1) + " (" + midiName(notes[locked]) + "). Tap it again for auto.";
}

$("minus").onclick = () => { if (notes.length > 1) { notes = defaultsFor(notes.length - 1); locked = null; save(); renderPickers(); updateHint(); } };
$("plus").onclick = () => { if (notes.length < MAX_STRINGS) { notes = defaultsFor(notes.length + 1); locked = null; save(); renderPickers(); updateHint(); } };

// meter ticks
(function () {
  const m = $("meter");
  for (let i = -5; i <= 5; i++) {
    const t = document.createElement("div"); t.className = "tick" + (i === 0 ? " mid" : "");
    t.style.left = (50 + i * 10) + "%"; t.style.height = i === 0 ? "44px" : "22px"; m.appendChild(t);
  }
})();

// ---------- Audio ----------
let ctx, analyser, stream, buf, running = false, lastRun = 0, recent = [], miss = 0;

async function start() {
  $("err").style.display = "none";
  stopTone();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    $("err").textContent = location.protocol === "file:" || !window.isSecureContext
      ? "The mic only works on a secure (https) page. Host this file on https, e.g. GitHub Pages or Netlify."
      : "Microphone blocked. Allow it in Safari ▸ aA ▸ Website Settings ▸ Microphone.";
    $("err").style.display = "block"; return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  const src = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser(); analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0;
  src.connect(analyser);
  buf = new Float32Array(analyser.fftSize);
  running = true; $("start").textContent = "Stop tuner"; $("status").textContent = "Pluck a string";
  requestAnimationFrame(loop);
}
function stop() {
  running = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ctx) ctx.close();
  $("start").textContent = "Start tuner"; show(null);
  $("status").textContent = "Stopped";
}
$("start").onclick = () => running ? stop() : start();
document.addEventListener("visibilitychange", () => { if (document.hidden && running) stop(); });

function loop(t) {
  if (!running) return;
  if (t - lastRun > 60) {
    lastRun = t;
    analyser.getFloatTimeDomainData(buf);
    const f = yin(buf, ctx.sampleRate);
    if (f) { miss = 0; recent.push(f); if (recent.length > 5) recent.shift();
             show([...recent].sort((a, b) => a - b)[recent.length >> 1]); }
    else if (++miss > 6) { recent = []; show(null); }
  }
  requestAnimationFrame(loop);
}

function show(f) {
  const noteEl = $("note"), st = $("status"), needle = $("needle");
  if (f === null) {
    noteEl.textContent = "–"; noteEl.style.color = "var(--dim)"; $("hz").textContent = "";
    needle.style.opacity = .25; needle.style.left = "50%";
    if (running) st.textContent = "Pluck a string"; st.style.color = "var(--dim)"; return;
  }
  const heard = freqMidi(f);
  let idx = locked;
  if (idx === null) {
    idx = 0; let best = Infinity;
    notes.forEach((m, i) => { const d = Math.abs(m - heard); if (d < best) { best = d; idx = i; } });
  }
  const cents = (heard - notes[idx]) * 100;
  const a = Math.abs(cents);
  const col = a <= 5 ? "var(--ok)" : a < 20 ? "var(--warn)" : "var(--bad)";
  noteEl.textContent = midiName(notes[idx]); noteEl.style.color = col;
  st.style.color = col;
  st.textContent = a <= 5 ? "In tune ✓" : cents < 0 ? "Tighten ↑  (" + Math.round(a) + "¢ flat)" : "Loosen ↓  (" + Math.round(a) + "¢ sharp)";
  $("hz").textContent = f.toFixed(1) + " Hz  →  target " + midiFreq(notes[idx]).toFixed(1) + " Hz  (string " + (idx + 1) + ")";
  needle.style.opacity = 1; needle.style.background = col;
  needle.style.left = (50 + Math.max(-50, Math.min(50, cents))) + "%";
}

renderPickers();
</script>
</body>
</html>
